name: version bump PR

on:
  release:
    types: [published]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - name: Sync Cargo version with latest tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          cargo update -w

      - name: Check if version changed
        id: diff
        run: |
          if git diff --quiet Cargo.toml Cargo.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create release PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}
          branch: release/version-bump-${{ github.event.release.tag_name }}
          base: main
          title: "chore(release): bump version to ${{ github.event.release.tag_name }}"
          commit-message: "chore(release): bump version to ${{ github.event.release.tag_name }}"