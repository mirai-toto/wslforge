instances:
  UbuntuSetup:
    override: true
    username: wsluser
    image:
      type: distro
      name: Ubuntu

    # Transfer files first, then run scripts against them
    files:
      - src: "configs/motd.txt"
        dest: /etc/motd
        mode: "644"

      - src: "configs/setup.sh"
        dest: /home/wsluser/setup.sh
        owner: wsluser
        mode: "755"

    scripts:
      shell: bash
      run:
        - "bash /home/wsluser/setup.sh"
