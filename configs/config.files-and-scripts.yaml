instances:
  UbuntuSetup:
    override: true
    username: wsluser
    image:
      type: distro
      name: Ubuntu

    # Transfer files first, then run scripts against them
    files:
      - src: "configs/setup.sh"
        dest: /home/wsluser/.local/bin/setup.sh
        owner: wsluser
        mode: "755"

      - src: "configs/dotfiles"
        dest: /home/wsluser/.config
        owner: wsluser

    scripts:
      shell: bash
      run:
        - "bash /home/wsluser/.local/bin/setup.sh"
