instances:
  UbuntuWslDev:
    override: true
    hostname: UbuntuWslDev
    username: wsluser
    password: root
    install_dir: "%userprofile%/VMs"
    files:
      - src: "motd.txt"
        dest: /etc/motd
        mode: "644"
    # proxy:
    #   http: http://proxy.example.com:3128
    #   https: http://proxy.example.com:3128
    #   no_proxy: localhost,127.0.0.1
    cloud_init:
      type: inline
      content: |
        #cloud-config
        ## template: jinja
        hostname: {{ hostname }}
        manage_etc_hosts: true

        {% if proxy %}
        apt:
          http_proxy: "{{ proxy.http }}"
          https_proxy: "{{ proxy.https }}"
        {% endif %}

        users:
          - name: {{ username }}
            groups: sudo
            shell: /bin/bash
            sudo: ['ALL=(ALL) NOPASSWD:ALL']
            lock_passwd: false
            passwd: "{{ password_hash | default('') }}"

        package_update: true
        package_upgrade: true
        packages:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg2
          - software-properties-common
          - git
          - python3
          - python3-pip
          - nodejs
          - npm

        write_files:
        {% if proxy %}
          - path: /etc/profile.d/proxy.sh
            permissions: '0644'
            content: |
              export http_proxy="{{ proxy.http }}"
              export https_proxy="{{ proxy.https }}"
              export no_proxy="{{ proxy.no_proxy }}"
          - path: /etc/apt/apt.conf.d/95proxies
            permissions: '0644'
            content: |
              Acquire::http::Proxy "{{ proxy.http }}";
              Acquire::https::Proxy "{{ proxy.https }}";
        {% endif %}
          - path: /usr/lib/binfmt.d/WSLInterop.conf
            permissions: '0644'
            content: |
              :WSLInterop:M::MZ::/init:PF
          - path: /etc/wsl.conf
            permissions: '0644'
            content: |
              [boot]
              systemd=true
              [automount]
              options = "metadata"
              [interop]
              appendWindowsPath = true
              [user]
              default={{ username }}

        runcmd:
        {% if proxy %}
          - git config --system http.proxy "{{ proxy.http }}"
          - git config --system https.proxy "{{ proxy.https }}"
        {% endif %}
          - curl -fsSL https://get.docker.com | sh
          - usermod -aG docker {{ username }}
          - systemctl enable docker
          - systemctl start docker
          - apt install -y docker-compose-plugin

        final_message: "✅ cloud-init finished on {{ hostname }}."
    image:
      type: distro
      name: Ubuntu
