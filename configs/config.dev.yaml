instances:
  UbuntuWslDev:
    override: true
    hostname: UbuntuWslDev
    username: wsluser
    password: root
    install_dir: "%userprofile%/VMs"
    files:
      - src: "motd.txt"
        dest: /etc/motd
        mode: "644"
    # proxy:
    #   http: http://proxy.example.com:3128
    #   https: http://proxy.example.com:3128
    #   no_proxy: localhost,127.0.0.1
    cloud_init:
      type: inline
      content: |
        #cloud-config
        hostname: {{ hostname }}
        manage_etc_hosts: true

        {% if proxy %}
        apt:
          http_proxy: "{{ proxy.http }}"
          https_proxy: "{{ proxy.https }}"
        {% endif %}

        users:
          - name: {{ username }}
            groups: sudo
            shell: /bin/bash
            sudo: ['ALL=(ALL) NOPASSWD:ALL']
            lock_passwd: false
            passwd: "{{ password_hash | default('') }}"

        package_update: true
        package_upgrade: true
        packages:
          - ca-certificates
          - curl
          - gcc
          - git
          - python3
          - python3-pip
          - openjdk-21-jdk
          - nodejs
          - npm

        write_files:
        {% if proxy %}
          - path: /etc/profile.d/proxy.sh
            permissions: '0644'
            content: |
              export http_proxy="{{ proxy.http }}"
              export https_proxy="{{ proxy.https }}"
              export no_proxy="{{ proxy.no_proxy }}"
          - path: /etc/apt/apt.conf.d/95proxies
            permissions: '0644'
            content: |
              Acquire::http::Proxy "{{ proxy.http }}";
              Acquire::https::Proxy "{{ proxy.https }}";
        {% endif %}
          - path: /etc/profile.d/local-bin.sh
            permissions: '0644'
            content: |
              export PATH="$PATH:/home/{{ username }}/.local/bin"
          - path: /etc/apt/apt.conf.d/99retries
            permissions: '0644'
            content: |
              Acquire::Retries "5";
              Acquire::http::Timeout "120";
              Acquire::https::Timeout "120";
          - path: /etc/wsl.conf
            permissions: '0644'
            content: |
              [boot]
              systemd=true
              [automount]
              options = "metadata"
              [interop]
              appendWindowsPath = true
              [user]
              default={{ username }}

        runcmd:
        {% if proxy %}
          - export http_proxy="{{ proxy.http }}"
          - export https_proxy="{{ proxy.https }}"
          - export no_proxy="{{ proxy.no_proxy }}"
          - git config --system http.proxy "{{ proxy.http }}"
          - git config --system https.proxy "{{ proxy.https }}"
        {% endif %}
          - curl -fsSL https://get.docker.com | sh
          - usermod -aG docker {{ username }}
          - systemctl enable docker
          - systemctl start docker
          - apt-get install -y docker-compose-plugin
          - |
            for port in 16443 6443 6444; do
              if ss -tlnp | grep -qE ":${port}[[:space:]]"; then
                echo "WARNING: port ${port} is already in use — skipping Kubernetes installation." >&2
                exit 0
              fi
            done
            snap install microk8s --classic
            usermod -a -G microk8s {{ username }}
            mkdir -p /home/{{ username }}/.kube
            microk8s status --wait-ready
            microk8s config > /home/{{ username }}/.kube/config
            chown -R {{ username }}:{{ username }} /home/{{ username }}/.kube
            snap install kubectl --classic

        final_message: "✅ cloud-init finished on {{ hostname }}."
    image:
      type: distro
      name: Ubuntu
