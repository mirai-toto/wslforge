instances:
  UbuntuScripts:
    override: true
    username: wsluser
    image:
      type: distro
      name: Ubuntu

    scripts:
      shell: bash
      run:
        # Install packages (runs as root)
        - "apt-get update && apt-get install -y curl git build-essential"

        # Write a welcome message shown on every login (runs as root, writes to /etc/)
        - "echo 'echo \"Welcome to UbuntuScripts, provisioned by wslforge!\"' > /etc/profile.d/welcome.sh"

        # Configure git globals for the user (su required — scripts run as root)
        - |
          su - wsluser -c 'git config --global user.name "wsluser"'
          su - wsluser -c 'git config --global core.autocrlf input'
          su - wsluser -c 'git config --global init.defaultBranch main'
