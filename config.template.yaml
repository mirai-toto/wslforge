instances:
  UbuntuWslDev:
    override: true
    # --- Basic instance settings ---
    hostname: UbuntuWslDev
    username: wsluser
    password: root

    # --- Network (all optional) ---
    # proxy:
    #   http: http://proxy.example.com:3128
    #   https: http://proxy.example.com:3128
    #   no_proxy: localhost,127.0.0.1

    # --- Custom variables (passed into cloud-init template) ---
    # vars:
    #   my_key: my_value
    #   another: whatever

    # --- File transfers (copied into the instance after creation) ---
    files:
      - src: "motd.txt"
        dest: /etc/motd
        mode: "644"
    # Advanced example: inject a CA certificate
    # files:
    #   - src: "%USERPROFILE%/certs/company.crt"
    #     dest: /usr/local/share/ca-certificates/company.crt
    #     owner: root         # optional
    #     mode: "644"         # optional

    # --- Paths ---
    install_dir: "%userprofile%/VMs"
    # Cloud-init user-data source (optional)
    cloud_init:
      type: file
      path: "cloud-init.yaml.j2"

    # Inline cloud-init example
    # cloud_init:
    #   type: inline
    #   content: |
    #     #cloud-config
    #     packages:
    #       - curl

    # --- Image source (choose ONE type) ---

    # Option A: Install from official WSL distro
    image:
      type: distro
      name: Ubuntu

    # Option B: Install from local rootfs file
    # image:
    #   type: file
    #   path: "%USERPROFILE%/Downloads/ubuntu-noble-wsl-amd64-ubuntu.rootfs.tar.gz"